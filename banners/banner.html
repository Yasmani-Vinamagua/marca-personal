<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner · Yasmani Viñamagua</title>
<style>
@font-face { font-family: "Manrope"; font-weight: 500; src: url("../web/fonts/manrope-500.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 700; src: url("../web/fonts/manrope-700.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 700; src: url("../web/fonts/nunito-700.woff2") format("woff2"); }
:root { --mid: #0D1530; --navy: #223367; --rosa: #FF1563; --fog: #F2F4F8; --mist: #C9D0E6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--mid); }
/* Todas las medidas en cqw/cqh del propio banner: el mismo diseño sirve en 4:1 (GitHub) y 3:1 (Figma) */
.banner { position: relative; overflow: hidden; width: 100vw; height: 100vh; background: var(--mid); container-type: size; font-family: "Manrope", sans-serif; }
.flow { position: absolute; right: 3cqw; top: -8cqh; height: 62cqh; }
.content { position: absolute; left: 6cqw; top: 50%; transform: translateY(-50%); width: 50cqw; }
.logo { width: 100%; display: block; }
.claim { margin: 3.2cqh 0 0 1.6cqw; font-weight: 500; font-size: max(2.05cqw, 4.2cqh); line-height: 1.3; color: var(--fog); }
.chips { display: flex; flex-wrap: wrap; gap: 1.2cqh 0.9cqw; margin: 6cqh 0 0 1.6cqw; padding: 0; list-style: none; }
.chips li { font: 700 max(1.45cqw, 3.2cqh)/1 "Nunito", sans-serif; padding: 1.7cqh 1.5cqw; border-radius: 999px; color: var(--fog); background: color-mix(in srgb, var(--navy) 85%, #fff 0%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mist) 28%, transparent); }
/* LinkedIn: la foto de perfil tapa hasta ~23 % del ancho en la mitad inferior, así que el contenido empieza al 26 % */
.li .content { left: 26cqw; width: 57cqw; }
.li .logo { width: 87.7%; }
.li .chips { gap: 1.2cqh .65cqw; }
.li .chips li { font-size: 1.22cqw; padding: 1.6cqh 1.15cqw; }
.chips .li-only { display: none; }
.li .chips .li-only { display: block; }
/* Notion: portada panorámica 5:1. Notion recorta arriba/abajo y la foto de perfil tapa abajo a la izquierda, así que el texto va en la franja central y los chips a la derecha */
.nt .flow { right: 2cqw; top: -14cqh; height: 70cqh; }
.nt .content { left: 6cqw; top: 40%; width: 44cqw; }
.nt .claim { font-size: 1.75cqw; margin: 5cqh 0 0 1.4cqw; }
.nt .chips { position: absolute; left: 60cqw; top: 44%; transform: translateY(-50%); width: 20cqw; margin: 0; gap: 2.5cqh .7cqw; }
.nt .chips li { font-size: 1.1cqw; padding: 2.4cqh 1.1cqw; }
</style>
</head>
<body>
<div class="banner">
  <img class="flow" src="../elementos-manual-identidad/aplicaciones/recurso-flujo-oscuro.svg" alt="">
  <div class="content">
    <img class="logo" src="../elementos-manual-identidad/logo/logo-horizontal-negativo.svg" alt="Yasmani Viñamagua">
    <p class="claim">Automatización de procesos con tecnología</p>
    <ul class="chips" aria-label="Disciplinas">
      <li class="li-only">Telecomunicaciones</li><li class="li-only">Redes</li><li>UX/UI</li><li>Front</li><li>Backend</li><li>Automatización</li>
    </ul>
  </div>
</div>
<script>if (location.hash === "#linkedin") document.body.classList.add("li");
if (location.hash === "#notion") document.body.classList.add("nt");</script>
</body>
</html>
