    <script>
      // Símbolo como trazos (geometría del manual: entrada 60°, tallo vertical, rama 45°, trazo 12, J=(46,56))
      var COLORS = {
        color: ["#223367", "#ff1563"],
        neg: ["#ffffff", "#ff1563"],
        ink: ["#111111", "#111111"],
        inkw: ["#ffffff", "#ffffff"],
      };
      document.querySelectorAll("[data-sym]").forEach(function (el) {
        var c = COLORS[el.getAttribute("data-sym")];
        el.outerHTML =
          '<svg class="sym" viewBox="7 -2 76 100" style="--a:' + c[0] + ";--b:" + c[1] + '">' +
          '<path class="s-ram" pathLength="1" stroke-dasharray="1 1" d="M46 56 L71.46 30.54"/>' +
          '<path class="s-ent" pathLength="1" stroke-dasharray="1 1" d="M19 9.23 L46 56"/>' +
          '<path class="s-tal" pathLength="1" stroke-dasharray="1 1" d="M46 56 L46 88"/></svg>';
      });

      var tl = gsap.timeline({ paused: true });

      // ===== Escena 1 (0–6) =====
      var hero = "#hero ";
      tl.fromTo(hero + ".s-ent", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.4);
      tl.fromTo(hero + ".s-tal", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.2);
      tl.fromTo(hero + ".s-ram", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power3.out" }, 1.75);
      tl.set(hero + "path", { opacity: 1 }, 0);
      tl.fromTo("#hero", { scale: 0.96 }, { scale: 1, duration: 2.2, ease: "sine.out" }, 0.4);
      tl.to("#hero", { height: 230, duration: 0.9, ease: "power3.inOut" }, 2.9);
      tl.to("#wm", { width: 880, duration: 0.9, ease: "power3.inOut" }, 2.9);
      tl.to("#lockup", { opacity: 0, duration: 0.3 }, 5.7);

      // ===== Escena 2 (6–13) =====
      tl.fromTo(".vcard", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.18, ease: "power3.out" }, 6.5);
      tl.fromTo("#variants .s-ent", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, stagger: 0.18 }, 6.7);
      tl.fromTo("#variants .s-tal", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, stagger: 0.18 }, 7.1);

      tl.fromTo(".lk", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.16, ease: "power3.out" }, 10.1);
            tl.to("#lockups", { opacity: 0, duration: 0.3 }, 12.7);

      tl.set("#lockups", { opacity: 1 }, 10.05);

      // ===== Escena 3a LinkedIn (13–17.5) =====
      tl.fromTo("#li", { opacity: 0, y: 70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 13.3);
      tl.fromTo("#li-flow", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 13.9);

      // ===== Escena 3b Tarjeta (17.5–21.5) =====
